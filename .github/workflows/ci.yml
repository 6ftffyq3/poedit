name: Build

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    env:
      MAKEFLAGS: -j2
    steps:
    - uses: actions/checkout@v4
    - name: Checkout submodules
      # submodules are not used by the build, but needed for `make dist`:
      run: git submodule update --init deps/json deps/pugixml
    - name: Install dependencies
      run: |
        sudo apt-get update && \
        sudo apt-get install \
            gettext \
            libexpat1-dev \
            libdb++-dev \
            libboost-dev \
            libboost-system-dev \
            libboost-thread-dev \
            libboost-iostreams-dev \
            liblucene++-dev \
            libicu-dev \
            libwxgtk3.2-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libnotify-dev \
            libwxgtk-webview3.2-dev \
            libgtk-3-dev \
            libgtkspell3-3-dev \
            libcld2-dev \
            libcpprest-dev \
            libsecret-1-dev \
            libpugixml-dev \
            nlohmann-json3-dev
    - name: Install ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}
    - name: Add ccache to path
      run: echo "/usr/lib/ccache" >> $GITHUB_PATH
    - name: Run bootstrap
      run: ./bootstrap
    - name: Run configure
      run: ./configure --prefix='${{ github.workspace }}/dist'
    - name: Run make distcheck
      run: make distcheck
    - name: Run make
      run: |
        mkdir -p dist
        make
        make install
    - name: Upload source tarball artifact
      uses: actions/upload-artifact@v4
      with:
        name: source-tarball
        path: poedit-*.tar.gz
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: dist
    - name: Upload entire dir
      uses: actions/upload-artifact@v4
      with:
        name: linux-full
        path: '*'

  build-macos:
    name: Build on macOS
    runs-on: macos-15
    env:
      XCODE_CONFIGURATION: Release
      # Empty = the project default. In Release that is a universal binary
      # (arm64 + x86_64), because only the Debug configurations set
      # ONLY_ACTIVE_ARCH = YES. Set to e.g. "arm64" for a faster, single-arch
      # build.
      MACOS_ARCHS: ''
    steps:
    - name: Setup parallel submodule fetching
      run: git config --global submodule.fetchJobs 10
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Deepen git history
      run: git fetch --deepen=100000 --filter=blob:none origin ${{ github.ref }}
    - name: Install ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}
    - name: Install external dependencies
      run: brew bundle --file=macos/Brewfile
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        # see a7fdeb1b and https://mastodon.social/@siracusa/115491845898322390
        xcode-version: '~26.0.0'
    - name: Build
      # Plain "build" (not "archive" + "-exportArchive"): exporting an archive
      # always needs a real Apple signing certificate and team, which CI lacks.
      # The project's own macos/poedit.xcconfig sets CODE_SIGN_IDENTITY = -
      # (ad-hoc, "Sign to Run Locally"), which needs no certificate. Do NOT
      # override CODE_SIGN_IDENTITY on the command line: the GettextTools
      # target relies on its own empty identity and is signed later by
      # scripts/macos-sign-bundle.sh.
      run: |
        arch_args=()
        if [ -n "$MACOS_ARCHS" ]; then
          arch_args=(ARCHS="$MACOS_ARCHS" ONLY_ACTIVE_ARCH=NO)
        fi
        xcodebuild \
          -workspace Poedit.xcworkspace \
          -scheme Poedit \
          -configuration "$XCODE_CONFIGURATION" \
          -destination 'generic/platform=macOS' \
          -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          -parallelizeTargets \
          build \
          "${arch_args[@]}"
    - name: Package app bundle
      run: |
        PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products/$XCODE_CONFIGURATION"
        APP="$PRODUCTS/Poedit.app"
        if [ ! -d "$APP" ]; then
          echo "::error::Poedit.app not found at $APP"
          ls -la "$RUNNER_TEMP/DerivedData/Build/Products" || true
          exit 1
        fi
        echo "Architectures in the main executable:"
        lipo -archs "$APP/Contents/MacOS/Poedit"
        if [ -n "$MACOS_ARCHS" ]; then
          SUFFIX=$(echo "$MACOS_ARCHS" | tr ' ' '-')
        else
          SUFFIX=universal
        fi
        echo "Signature of the built app (ad-hoc, no identity):"
        codesign --display --verbose=2 "$APP" 2>&1 || true
        codesign --verify --deep --verbose=2 "$APP" \
          || echo "::warning::codesign verification of the ad-hoc signature failed"
        # upload-artifact drops symlinks and the executable bit, which breaks
        # .app bundles (Sparkle.framework uses symlinks). ditto keeps both.
        mkdir -p dist dsym
        ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Poedit-macos-$SUFFIX.zip"
        # Debug symbols, like the PDBs in the Windows build
        if [ -d "$APP.dSYM" ]; then
          ditto -c -k --keepParent "$APP.dSYM" "dsym/Poedit-macos-$SUFFIX-dSYM.zip"
        fi
    - name: Upload bundle
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: dist/*.zip
        if-no-files-found: error
    - name: Upload debug symbols
      uses: actions/upload-artifact@v4
      with:
        name: macos-dsym
        path: dsym/*.zip
        if-no-files-found: ignore
    - name: Upload entire dir
      uses: actions/upload-artifact@v4
      with:
        name: macos-full
        path: '*'

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
    - name: Setup parallel submodule fetching
      run: git config --global submodule.fetchJobs 10
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Deepen git history
      run: git fetch --deepen=100000 --filter=blob:none origin ${{ github.ref }}
    - uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64
    - uses: nuget/setup-nuget@v2
    - name: Restore NuGet packages
      run: nuget restore Poedit.sln
    - name: Set up environment variables
      run: |
        & .\win32\env.bat
    - name: List redist dir
      run: |
        Get-ChildItem -Path "${env:VCToolsRedistDir}" -Recurse
    - name: Build solution
      run: cd win32 && msbuild distrib.proj /p:configuration=Release
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: win32
    - name: Upload entire dir
      uses: actions/upload-artifact@v4
      with:
        name: windows-full
        path: '*'

  publish-release:
    name: Publish release tarball
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-tarball

      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          prerelease: true
          artifacts: "*.tar.gz"
          token: ${{ secrets.GITHUB_TOKEN }}
